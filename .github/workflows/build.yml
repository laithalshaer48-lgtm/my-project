name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFEOPEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SAFEOPEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        env:
          SAFEOPEN_KEYSTORE_PASSWORD: ${{ secrets.SAFEOPEN_KEYSTORE_PASSWORD }}
          SAFEOPEN_KEY_ALIAS: ${{ secrets.SAFEOPEN_KEY_ALIAS }}
          SAFEOPEN_KEY_PASSWORD: ${{ secrets.SAFEOPEN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SafeOpen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SafeOpen-apk
          path: dist/SafeOpen.apk

      - name: Publish GitHub release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SafeOpen.apk
